<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TIQ AI Assistant – Testing Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#0b1220;
  color:#fff;
}

.container{display:flex;height:100dvh}

/* Sidebar */
.sidebar{
  width:260px;background:#0f172a;padding:22px;
  display:flex;flex-direction:column;border-right:1px solid #1f2937
}
.logo{font-size:20px;font-weight:700;color:#38bdf8;margin-bottom:25px}
.btn{
  width:100%;padding:12px;margin-top:10px;
  background:#1f2937;border:none;color:white;
  border-radius:12px;cursor:pointer;font-weight:600
}
.btn:hover{background:#334155}

/* Main */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* Header FIXED */
.header{
  padding:16px 18px;
  border-bottom:1px solid #1f2937;
  background:#0b1220;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.header-left{
  display:flex;
  flex-direction:column;
}
.status{
  background:#16a34a;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}

/* Chat */
.chat-box{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
  overscroll-behavior:contain;
}

.msg{
  padding:12px 16px;border-radius:16px;
  max-width:75%;line-height:1.5;font-size:15px;
  white-space:pre-wrap;box-shadow:0 2px 8px rgba(0,0,0,.25)
}
.user{background:#2563eb;margin-left:auto}
.ai{background:#16a34a}
.typing{opacity:.7;font-style:italic}

/* Bottom input */
.bottom{
  flex-shrink:0;
  padding:12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid #1f2937;
  background:#0f172a;
  display:flex;
  gap:10px;
}

/* Input */
input{
  flex:1;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#1f2937;
  color:#fff;
  font-size:15px
}
.send{
  padding:14px 22px;
  background:#38bdf8;
  border:none;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
}

/* MOBILE FIXES */
@media(max-width:900px){
  .sidebar{display:none}
  .msg{max-width:90%}
}

/* ⭐ Small phones */
@media(max-width:480px){

  /* Stack header nicely */
  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  /* Stack input + button vertically */
  .bottom{
    flex-direction:column;
  }

  .send{
    width:100%;
  }
}
</style>
</head>

<body>
<div class="container">

<div class="sidebar">
  <div class="logo">⚡ TIQ AI Tester</div>
  <button class="btn" onclick="clearChat()">🧹 Clear Chat</button>
  <button class="btn" onclick="testPing()">🔄 Test Backend</button>
  <p style="margin-top:auto;font-size:12px;color:#94a3b8">
    Session phone:<br><span id="sessionPhone"></span>
  </p>
</div>

<div class="main">
  <div class="header">
    <div class="header-left">
      <h3 style="margin:0">TIQ AI Assistant</h3>
      <div style="font-size:12px;color:#94a3b8">
        SMS Simulator • Session based per browser
      </div>
    </div>
    <div class="status">AI Online</div>
  </div>

  <div id="chat" class="chat-box"></div>

  <div class="bottom">
    <input id="msg" placeholder="Type a message…">
    <button class="send" onclick="sendMsg()">Send</button>
  </div>
</div>
</div>

<script>
const BASE_URL="https://shakeel401-tiq-test-backend.hf.space";
const chat=document.getElementById("chat");

function generatePhone(){
  let num="+1555";
  for(let i=0;i<7;i++) num+=Math.floor(Math.random()*10);
  return num;
}
let phone=localStorage.getItem("tiq_phone");
if(!phone){phone=generatePhone();localStorage.setItem("tiq_phone",phone);}
document.getElementById("sessionPhone").innerText=phone;

function scrollBottom(){chat.scrollTop=chat.scrollHeight}
function addMsg(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  chat.appendChild(div);
  scrollBottom();
}
function addTyping(){
  const div=document.createElement("div");
  div.className="msg ai typing";
  div.id="typing";
  div.innerText="AI is typing...";
  chat.appendChild(div);
  scrollBottom();
}
function removeTyping(){
  const el=document.getElementById("typing");
  if(el) el.remove();
}

async function sendMsg(){
  const input=document.getElementById("msg");
  const msg=input.value.trim();
  if(!msg) return;

  addMsg(msg,"user");
  input.value="";
  addTyping();

  try{
    const res=await fetch(BASE_URL+"/test/chat",{
      method:"POST",
      body:new URLSearchParams({Body:msg,From:phone})
    });
    const data=await res.json();
    removeTyping();
    addMsg(data.reply || "Server error","ai");
  }catch{
    removeTyping();
    addMsg("Network error","ai");
  }
}

document.getElementById("msg")
.addEventListener("keydown",e=>{
  if(e.key==="Enter") sendMsg();
});

async function testPing(){
  addMsg("Checking backend...","user");
  const res=await fetch(BASE_URL);
  const data=await res.json();
  addMsg(JSON.stringify(data),"ai");
}
function clearChat(){chat.innerHTML=""}
</script>
</body>
</html>
